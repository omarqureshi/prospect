name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # The CDK bindings are jsii-generated and talk to a kernel running as a
      # Node sidecar, so the CDK specs need Node even though no Node is written.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bundle exec rspec

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # Compiles the emitted types against spec/golden/usage.ts, whose
      # @ts-expect-error assertions fail the build if the types stop
      # constraining. A golden file alone would not catch that.
      - run: npx tsc -p spec/golden
